<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBoard</title>
<meta property="og:type" content="profile">
<meta property="og:site_name" content="TeraBoard">
<meta property="og:title" content="TeraBoard">
<meta property="og:description" content="מצא מטפל/ת מתאים/ה ב-TeraBoard">
<meta property="og:image" content="">
<meta property="og:url" content="">
<link rel="canonical" id="canonicalLink" href="">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;800;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/celestial.css">
</head>
<body>

<header>
  <a class="logo" id="logoLink" href="therapist-board.html">
    <div class="logo-mark">T</div>
    TeraBoard
  </a>
  <nav><a href="therapist-board.html" id="navBack">חזרה ללוח</a></nav>
</header>

<div class="profile-wrap" id="root">
  <div class="muted" style="padding:60px 0;text-align:center;" id="loadingMsg">…</div>
</div>

<!-- Booking modal (same structure as the boards) -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div id="modalFormWrap">
    <h3 id="modalTitle"></h3>
    <p class="modal-sub" id="modalSub"></p>
    <div class="form-row"><label id="lblName"></label><input type="text" id="bName" oninput="document.getElementById('formError').style.display='none'"></div>
    <div class="form-row"><label id="lblPhone"></label><input type="tel" id="bPhone" oninput="document.getElementById('formError').style.display='none'"></div>
    <div class="form-row">
      <label id="lblType"></label>
      <select id="bType"><option id="optIntro"></option><option id="optRegular"></option><option id="optRemote"></option></select>
    </div>
    <div class="form-row">
      <label id="lblPick"></label>
      <div class="time-slots" id="slots">
        <div class="slot">09:00</div><div class="slot">10:30</div><div class="slot">12:00</div>
        <div class="slot">14:00</div><div class="slot">16:30</div><div class="slot">18:00</div>
      </div>
    </div>
    <p id="formError" role="alert" aria-live="polite" style="color:#b94569;font-size:13px;margin:0 0 8px;display:none;"></p>
    <div class="modal-actions">
      <button class="close-btn" id="btnCancel" onclick="closeModal()"></button>
      <button class="confirm-btn" id="btnConfirm" onclick="confirmBooking()"></button>
    </div>
    </div>
    <div id="modalSuccessWrap" style="display:none;text-align:center;padding:32px 20px;">
      <div style="font-size:52px;margin-bottom:16px;">🪷</div>
      <h3 style="font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:8px;" id="successTitle"></h3>
      <p style="color:var(--ink-soft);font-size:14px;line-height:1.65;" id="successMsg"></p>
      <button class="btn-full" onclick="closeModal()" style="margin-top:20px;" id="btnClose"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script>
// ---- i18n ----
const I18N = {
  he: { dir:'rtl', back:'חזרה ללוח', years:'שנות ניסיון', online:'אונליין', verified:'מאומת', per:'/ פגישה', noBio:'לא הוזן מידע על המטפל/ת.',
        about:'על המטפל/ת', reviews:'ביקורות', noReviews:'אין ביקורות עדיין.', book:'תיאום פגישה',
        name:'שם מלא', phone:'טלפון', type:'סוג פגישה', pick:'בחר שעה — מחר',
        intro:'פגישת היכרות (חינם)', regular:'פגישה רגילה', remote:'פגישה מרחוק (זום)',
        cancel:'ביטול', confirm:'אשר תיאום', close:'סגירה',
        bookedTitle:n=>`הפגישה עם ${n} תואמה! ✓`, bookedMsg:'בקשתך נשלחה למטפל/ת. הם יחזרו אליך לאישור סופי בהקדם.',
        notFound:'המטפל/ת לא נמצא/ה.', bookWith:n=>`תיאום פגישה עם ${n}`, sub:'בחר את הפרטים שלך ושעה זמינה',
        share:'שתף פרופיל', shareCopied:'✓ הקישור הועתק',
        errName:'נא להזין שם מלא', errPhone:'נא להזין מספר טלפון', errSlot:'נא לבחור שעה מועדפת' },
  en: { dir:'ltr', back:'Back to board', years:'yrs experience', online:'Online', verified:'Verified', per:'/ session', noBio:'No information provided yet.',
        about:'About', reviews:'Reviews', noReviews:'No reviews yet.', book:'Book a session',
        name:'Full name', phone:'Phone', type:'Session type', pick:'Pick a time — tomorrow',
        intro:'Intro call (free)', regular:'Regular session', remote:'Remote (Zoom)',
        cancel:'Cancel', confirm:'Confirm booking', close:'Close',
        bookedTitle:n=>`Session with ${n} booked! ✓`, bookedMsg:'Your request has been sent to the therapist. They will be in touch to confirm shortly.',
        notFound:'Therapist not found.', bookWith:n=>`Book a session with ${n}`, sub:'Enter your details and pick an available time',
        share:'Share profile', shareCopied:'✓ Link copied',
        errName:'Please enter your full name', errPhone:'Please enter your phone number', errSlot:'Please pick a time slot' },
  pt: { dir:'ltr', back:'Voltar ao quadro', years:'anos de exp.', online:'Online', verified:'Verificado', per:'/ sessão', noBio:'Nenhuma informação fornecida ainda.',
        about:'Sobre', reviews:'Avaliações', noReviews:'Ainda sem avaliações.', book:'Agendar sessão',
        name:'Nome completo', phone:'Telefone', type:'Tipo de sessão', pick:'Escolha um horário — amanhã',
        intro:'Conversa inicial (grátis)', regular:'Sessão padrão', remote:'Remota (Zoom)',
        cancel:'Cancelar', confirm:'Confirmar', close:'Fechar',
        bookedTitle:n=>`Sessão com ${n} agendada! ✓`, bookedMsg:'Sua solicitação foi enviada ao terapeuta. Eles entrarão em contato para confirmação em breve.',
        notFound:'Terapeuta não encontrado.', bookWith:n=>`Agendar sessão com ${n}`, sub:'Preencha seus dados e escolha um horário disponível',
        share:'Compartilhar perfil', shareCopied:'✓ Link copiado',
        errName:'Informe seu nome completo', errPhone:'Informe seu telefone', errSlot:'Selecione um horário disponível' },
};
const CUR = { he:'₪', en:'$', pt:'R$' };

const params = new URLSearchParams(location.search);
const qid = params.get('id');
let lang = params.get('lang') || sessionStorage.getItem('tb_lang') || 'he';
if (!I18N[lang]) lang = 'he';
const T = I18N[lang];
const cur = CUR[lang];
let therapist = null;

document.documentElement.lang = lang;
document.documentElement.dir = T.dir;
const boardHref = 'therapist-board' + (lang==='he'?'':'-'+lang) + '.html';
document.getElementById('logoLink').href = boardHref;
document.getElementById('navBack').href = boardHref;
const loadEl = document.getElementById('loadingMsg');
if (loadEl) loadEl.textContent = ({he:'טוען…', en:'Loading…', pt:'Carregando…'})[lang] || '…';

function setText() {
  document.getElementById('navBack').textContent = T.back;
  document.getElementById('lblName').textContent = T.name;
  document.getElementById('lblPhone').textContent = T.phone;
  document.getElementById('lblType').textContent = T.type;
  document.getElementById('lblPick').textContent = T.pick;
  document.getElementById('optIntro').textContent = T.intro;
  document.getElementById('optRegular').textContent = T.regular;
  document.getElementById('optRemote').textContent = T.remote;
  document.getElementById('btnCancel').textContent = T.cancel;
  document.getElementById('btnConfirm').textContent = T.confirm;
  document.getElementById('btnClose').textContent = T.close;
}

async function load() {
  // 1) fast-path: object stashed by the board before navigation
  const cached = sessionStorage.getItem('tb_profile');
  if (cached) {
    try { const o = JSON.parse(cached); if (!qid || o.id === qid) therapist = o; } catch (e) {}
  }
  // 2) Supabase by id (shareable URL)
  if (!therapist && qid && TeraData.isLive()) {
    const { data } = await TeraData.client.from('therapists').select('*').eq('id', qid).single();
    if (data) therapist = {
      id: data.id, name: data.name, speciality: data.speciality, cat: data.category,
      area: data.area, online: data.online, price: data.price, exp: data.exp, bio: data.bio,
      rating: Number(data.rating), reviews: data.reviews_count, initial: data.initial,
      verified: data.verified, website: data.website_url || undefined, instagram: data.instagram || undefined, photo: data.photo_url || undefined,
    };
  }
  render();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render() {
  setText();
  const root = document.getElementById('root');
  if (!therapist) { root.innerHTML = `<div class="muted" style="padding:60px 0;text-align:center;">${T.notFound}</div>`; return; }
  const t = therapist;
  document.title = `${t.name} — TeraBoard`;
  // dynamic OG tags for WhatsApp / Telegram / Instagram link previews
  const setOg = (p, v) => { const el = document.querySelector(`meta[property="${p}"]`); if (el && v) el.setAttribute('content', v); };
  setOg('og:title', `${t.name} — TeraBoard`);
  setOg('og:description', t.bio ? t.bio.slice(0, 160) : `${t.speciality} · TeraBoard`);
  setOg('og:image', t.photo || '');
  setOg('og:url', location.href);
  // canonical
  const canonEl = document.getElementById('canonicalLink');
  if (canonEl) canonEl.href = location.origin + (t.id ? `/t/${t.id}` : location.pathname) + '?lang=' + lang;
  // JSON-LD structured data (Person schema) for Google
  const ld = { '@context':'https://schema.org', '@type':'Person', name: t.name, jobTitle: t.speciality };
  if (t.bio) ld.description = t.bio.slice(0, 300);
  if (t.photo) ld.image = t.photo;
  ld.url = location.href;
  const sameAs = [];
  if (t.website) sameAs.push(t.website);
  if (t.instagram) sameAs.push(t.instagram.startsWith('http') ? t.instagram : `https://instagram.com/${t.instagram.replace(/^@/,'')}`);
  if (sameAs.length) ld.sameAs = sameAs;
  let ldEl = document.getElementById('jsonLd');
  if (!ldEl) { ldEl = document.createElement('script'); ldEl.type = 'application/ld+json'; ldEl.id = 'jsonLd'; document.head.appendChild(ldEl); }
  ldEl.textContent = JSON.stringify(ld);
  root.innerHTML = `
    <a class="back-link" href="${boardHref}">← ${T.back}</a>
    <div class="profile-top">
      ${t.photo ? `<div class="profile-avatar" style="background-image:url('${t.photo}');background-size:cover;background-position:center;"></div>` : `<div class="profile-avatar">${esc(t.initial || (t.name||'?')[0])}</div>`}
      <div class="profile-id">
        <h1>${esc(t.name)}</h1>
        <div class="speciality">${esc(t.speciality)}</div>
        ${t.verified ? `<div class="verified-tag">✓ ${T.verified}</div>` : ''}
        <div class="pill-row">
          <span class="pill">📍 ${esc(t.area)}</span>
          <span class="pill">⏱ ${esc(t.exp)} ${T.years}</span>
          ${t.online ? `<span class="pill">💻 ${T.online}</span>` : ''}
        </div>
        <div class="profile-meta">
          <div class="rating"><span class="stars">${TeraData.starsHTML(t.rating)}</span> <span class="rating-num">${esc(t.rating)}</span> <span class="reviews-count">(${esc(t.reviews)})</span></div>
          <div class="profile-price">${cur}${esc(t.price)} <small>${T.per}</small></div>
        </div>
        ${TeraData.contactLinksHTML(t)}
      </div>
    </div>

    <div class="profile-section">
      <h2>${T.about}</h2>
      <div class="bio">${t.bio ? esc(t.bio) : `<span class="muted">${T.noBio}</span>`}</div>
      <div class="book-cta" style="display:flex;gap:10px;">
        <button class="btn-full" onclick="openModal()" style="flex:1;">${T.book}</button>
        <button class="btn-outline" id="shareBtn" onclick="shareProfile()" style="white-space:nowrap;padding:0 18px;">${T.share}</button>
      </div>
    </div>

    <div class="profile-section">
      <h2>${T.reviews}</h2>
      <div id="reviews"><div class="muted">${T.noReviews}</div></div>
    </div>
  `;
  loadReviews();
}

async function loadReviews() {
  if (!therapist || !therapist.id || !TeraData.isLive()) return;
  const { data } = await TeraData.client.from('reviews').select('*').eq('therapist_id', therapist.id).order('created_at', { ascending: false });
  if (!data || !data.length) return;
  document.getElementById('reviews').innerHTML = data.map(r => `
    <div class="review">
      <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
      <div class="r-comment">${esc(r.comment || '')}</div>
    </div>`).join('');
}

// ---- share ----
function shareProfile() {
  const url = location.href;
  const title = `${therapist.name} — TeraBoard`;
  if (navigator.share) {
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('shareBtn');
      if (btn) { btn.textContent = T.shareCopied; setTimeout(() => { btn.textContent = T.share; }, 2200); }
    });
  }
}

// ---- booking ----
function openModal() {
  document.getElementById('modalTitle').textContent = T.bookWith(therapist.name);
  document.getElementById('modalSub').textContent = T.sub;
  document.getElementById('bName').value = '';
  document.getElementById('bPhone').value = '';
  document.getElementById('formError').style.display = 'none';
  document.getElementById('modalFormWrap').style.display = '';
  document.getElementById('modalSuccessWrap').style.display = 'none';
  document.getElementById('modal').classList.add('active');
  document.querySelectorAll('.slot').forEach(s => { s.classList.remove('selected'); s.onclick = () => {
    document.querySelectorAll('.slot').forEach(x => x.classList.remove('selected')); s.classList.add('selected');
  };});
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.getElementById('modalFormWrap').style.display = '';
  document.getElementById('modalSuccessWrap').style.display = 'none';
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
}
async function confirmBooking() {
  const name = document.getElementById('bName').value.trim();
  const phone = document.getElementById('bPhone').value.trim();
  const slotEl = document.querySelector('.slot.selected');
  const errEl = document.getElementById('formError');
  if (!name)   { errEl.textContent = T.errName; errEl.style.display = 'block'; return; }
  if (!phone)  { errEl.textContent = T.errPhone; errEl.style.display = 'block'; return; }
  if (!slotEl) { errEl.textContent = T.errSlot; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  const btn = document.getElementById('btnConfirm'); btn.disabled = true;
  await TeraData.createBooking({
    therapist_id: therapist.id || null,
    full_name: name,
    phone,
    type: document.getElementById('bType').value,
    notes: T.pick + ': ' + slotEl.textContent,
    status: 'pending'
  });
  btn.disabled = false;
  document.getElementById('modalFormWrap').style.display = 'none';
  document.getElementById('successTitle').textContent = T.bookedTitle(therapist.name);
  document.getElementById('successMsg').textContent = T.bookedMsg;
  document.getElementById('modalSuccessWrap').style.display = 'block';
}

load();
</script>
</body>
</html>
