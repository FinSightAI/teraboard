<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBoard</title>
<meta name="robots" content="noindex">
<script>
  // Route to the correct language board based on browser locale.
  // Falls back to English for any unrecognised locale.
  (function () {
    var l = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    var dest = l.startsWith('pt') ? '/pt'
             : (l.startsWith('he') || l.startsWith('iw')) ? '/he'
             : '/en';
    location.replace(dest);
  })();
</script>
</head>
<body></body>
</html>
