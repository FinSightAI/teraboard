<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBoard — לוח המטפלים</title>
<meta name="description" content="פלטפורמה שמחברת אותך למטפלים מורשים ומאומתים — פסיכולוגים, מטפלים זוגיים, CBT ועוד. חפש, השווה ותאם פגישה בקלות.">
<meta property="og:title" content="TeraBoard — מצא מטפל">
<meta property="og:description" content="פלטפורמה שמחברת אותך למטפלים מורשים — חפש, השווה ותאם פגישה.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;800;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/celestial.css">
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-mark">T</div>
    TeraBoard
  </a>
  <nav>
    <a href="#">מצא מטפל</a>
    <a href="how-it-works.html?lang=he">איך זה עובד</a>
    <a href="for-therapists.html?lang=he">למטפלים</a>
    <div class="lang-switch">
      <a href="#" class="active">HE</a>
      <a href="therapist-board-en.html">EN</a>
      <a href="therapist-board-pt.html">PT</a>
    </div>
    <button class="btn-primary" onclick="location.href='for-therapists.html?lang=he'">הרשמה</button>
  </nav>
</header>

<section class="hero">
  <h1>מצא את <span>המטפל המתאים</span> לך</h1>
  <p>פלטפורמה אחת שמחברת אותך לאלפי מטפלים מקצועיים בתחום הנפש, הרגש והגוף — מבוססת ביקורות אמיתיות וזמינות בזמן אמת.</p>
  <div id="moodResultBanner"></div>
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="חיפוש לפי שם, תחום או התמחות...">
    <select id="areaFilter">
      <option value="">כל האזורים</option>
      <option>תל אביב</option>
      <option>ירושלים</option>
      <option>חיפה</option>
      <option>שרון</option>
      <option>אונליין</option>
    </select>
    <button class="search-btn" onclick="renderCards()">חיפוש</button>
  </div>
</section>

<div id="statsBar"></div>

<div class="categories" id="categories"></div>

<section class="listings">
  <div id="onlineBanner"></div>
  <div class="listings-header">
    <div>
      <h2>מטפלים מומלצים</h2>
      <span id="resultCount">12 תוצאות</span>
    </div>
    <select class="sort-select" id="sortBy" onchange="renderCards()">
      <option value="rating">דירוג גבוה</option>
      <option value="price-low">מחיר: מהזול ליקר</option>
      <option value="price-high">מחיר: מהיקר לזול</option>
      <option value="reviews">הכי הרבה ביקורות</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- Booking Modal -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div id="modalFormWrap">
    <h3 id="modalTitle">תיאום פגישה</h3>
    <p class="modal-sub" id="modalSub"></p>
    <div class="form-row">
      <label>שם מלא</label>
      <input type="text" id="bName" placeholder="הקלד את שמך" oninput="document.getElementById('formError').style.display='none'">
    </div>
    <div class="form-row">
      <label>טלפון</label>
      <input type="tel" id="bPhone" placeholder="050-0000000" oninput="document.getElementById('formError').style.display='none'">
    </div>
    <div class="form-row">
      <label>סוג פגישה</label>
      <select id="bType">
        <option>פגישת היכרות (חינם)</option>
        <option>פגישה רגילה</option>
        <option>פגישה מרחוק (זום)</option>
      </select>
    </div>
    <div class="form-row">
      <label>בחר שעה — מחר</label>
      <div class="time-slots" id="slots">
        <div class="slot">09:00</div>
        <div class="slot">10:30</div>
        <div class="slot">12:00</div>
        <div class="slot">14:00</div>
        <div class="slot">16:30</div>
        <div class="slot">18:00</div>
      </div>
    </div>
    <p id="formError" role="alert" aria-live="polite" style="color:#b94569;font-size:13px;margin:0 0 8px;display:none;"></p>
    <div class="modal-actions">
      <button class="close-btn" onclick="closeModal()">ביטול</button>
      <button class="confirm-btn" id="confirmBtn" onclick="confirmBooking()">אשר תיאום</button>
    </div>
    </div>
    <div id="modalSuccessWrap" style="display:none;text-align:center;padding:32px 20px;">
      <div style="font-size:52px;margin-bottom:16px;">🪷</div>
      <h3 style="font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:8px;" id="successTitle"></h3>
      <p style="color:var(--ink-soft);font-size:14px;line-height:1.65;" id="successMsg"></p>
      <button class="btn-full" onclick="closeModal()" style="margin-top:20px;">סגירה</button>
    </div>
  </div>
</div>

<!-- Supabase client + TeraBoard data layer + features -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
const MOOD_L = {
  skip: 'דלג/י',
  s1title: 'מה קורה איתך?',
  s1sub: 'בחר/י את מה שהכי קרוב למה שאת/ה מרגיש/ה',
  s2title: 'איך את/ה מעדיף/ה פגישות?',

  moods: [

    { icon: '😢', label: 'עצב / דיכאון',        cat: 'anxiety'     },
    { icon: '💔', label: 'זוגיות / משפחה',      cat: 'couple'      },
    { icon: '🌀', label: 'מאבד/ת כיוון',        cat: 'psy'         },
    { icon: '😤', label: 'שחיקה / עייפות',      cat: 'mindfulness' },

  ],

    { icon: '📍', label: 'פנים אל פנים', val: 'local'   },
    { icon: '🤷', label: 'לא משנה לי',   val: 'any'     },
  ],
  timing: [
    { icon: '⚡', label: 'השבוע',          val: 'soon'     },
    { icon: '📅', label: 'החודש',          val: 'month'    },
    { icon: '👀', label: 'רק מסתכל/ת',    val: 'browsing' },
  ],
};
const STATS_L = { online: 'אונליין עכשיו', rating: 'ממוצע', reviews: 'ביקורות' };
const CTA_L   = { label: 'אני צריך/ה לדבר עכשיו' };
let _onlineOnly = false;

const categories = [
  { icon: '🧠', name: 'הכל', value: 'all' },
  { icon: '💭', name: 'פסיכותרפיה', value: 'psy' },
  { icon: '👥', name: 'זוגיות', value: 'couple' },
  { icon: '👶', name: 'ילדים ונוער', value: 'kids' },
  { icon: '🌿', name: 'CBT', value: 'cbt' },
  { icon: '🎭', name: 'אמנות', value: 'art' },
  { icon: '🧘', name: 'גוף-נפש', value: 'body' },
  { icon: '💊', name: 'התמכרויות', value: 'addiction' },
  { icon: '🌧️', name: 'טראומה ו-PTSD', value: 'trauma' },
  { icon: '👨‍👩‍👧', name: 'משפחה', value: 'family' },
  { icon: '🌀', name: 'חרדה ודיכאון', value: 'anxiety' },
  { icon: '🪷', name: 'מיינדפולנס', value: 'mindfulness' },
  { icon: '💞', name: 'מיניות', value: 'sexual' },
  { icon: '🕊️', name: 'אובדן ושכול', value: 'grief' },
  { icon: '🟢', name: 'זמין/ה היום', value: 'today' },
  { icon: '❤️', name: 'שמורים', value: 'favs', dynamic: true },
];

let therapists = [
  { name: 'ד״ר נועה לוי', speciality: 'פסיכולוגית קלינית', cat: 'psy', area: 'תל אביב', online: true, rating: 4.9, reviews: 142, price: 450, exp: 12, initial: 'נ', badge: 'מומלץ', website: 'https://noa-levi.co.il', instagram: 'noa.levi.psy', available_today: true, video_url: 'https://www.youtube.com/watch?v=MNjMRnv0kBQ' },
  { name: 'יואב כהן', speciality: 'מטפל זוגי וקבוצתי', cat: 'couple', area: 'ירושלים', online: true, rating: 4.8, reviews: 89, price: 380, exp: 8, initial: 'י', available_today: true },
  { name: 'ד״ר שירה אברהם', speciality: 'CBT והפרעות חרדה', cat: 'cbt', area: 'תל אביב', online: false, rating: 5.0, reviews: 56, price: 500, exp: 15, initial: 'ש', badge: 'חדש' },
  { name: 'מיכל ברק', speciality: 'מטפלת באמנות', cat: 'art', area: 'חיפה', online: true, rating: 4.7, reviews: 78, price: 320, exp: 6, initial: 'מ' },
  { name: 'אסף רוזן', speciality: 'פסיכותרפיה דינמית', cat: 'psy', area: 'שרון', online: false, rating: 4.9, reviews: 203, price: 420, exp: 18, initial: 'א', badge: 'מומלץ' },
  { name: 'תמר ויסמן', speciality: 'מטפלת רגשית לילדים', cat: 'kids', area: 'תל אביב', online: true, rating: 4.8, reviews: 95, price: 360, exp: 9, initial: 'ת' },
  { name: 'ד״ר רונן שטרן', speciality: 'התמכרויות וסמים', cat: 'addiction', area: 'ירושלים', online: true, rating: 4.6, reviews: 67, price: 480, exp: 14, initial: 'ר' },
  { name: 'יעל גולדמן', speciality: 'יוגה תרפיה וגוף-נפש', cat: 'body', area: 'אונליין', online: true, rating: 4.9, reviews: 124, price: 280, exp: 7, initial: 'י', available_today: true },
  { name: 'דנה אלון', speciality: 'CBT לנוער', cat: 'cbt', area: 'חיפה', online: true, rating: 4.7, reviews: 41, price: 350, exp: 5, initial: 'ד' },
  { name: 'אורי פרידמן', speciality: 'טיפול זוגי IMAGO', cat: 'couple', area: 'תל אביב', online: false, rating: 5.0, reviews: 38, price: 550, exp: 11, initial: 'א', badge: 'חדש' },
  { name: 'נטע ברגר', speciality: 'אמנות וטראומה', cat: 'art', area: 'שרון', online: true, rating: 4.8, reviews: 72, price: 340, exp: 10, initial: 'נ' },
  { name: 'ד״ר עומר נחום', speciality: 'פסיכואנליזה יונגיאנית', cat: 'psy', area: 'ירושלים', online: false, rating: 4.9, reviews: 108, price: 520, exp: 20, initial: 'ע', badge: 'מומלץ' },
  { name: 'ד״ר ליאת מזרחי', speciality: 'טראומה ו-EMDR', cat: 'trauma', area: 'תל אביב', online: true, rating: 4.9, reviews: 64, price: 470, exp: 16, initial: 'ל', photo: 'https://randomuser.me/api/portraits/women/90.jpg' },
  { name: 'גיא שפירא', speciality: 'טיפול משפחתי', cat: 'family', area: 'שרון', online: false, rating: 4.8, reviews: 81, price: 420, exp: 12, initial: 'ג', photo: 'https://randomuser.me/api/portraits/men/15.jpg' },
  { name: 'ד״ר מאיה גל', speciality: 'חרדה ודיכאון', cat: 'anxiety', area: 'ירושלים', online: true, rating: 4.9, reviews: 118, price: 450, exp: 14, initial: 'מ', badge: 'מומלץ', photo: 'https://randomuser.me/api/portraits/women/56.jpg' },
  { name: 'נועם בן-דוד', speciality: 'מיינדפולנס וגוף-נפש', cat: 'mindfulness', area: 'אונליין', online: true, rating: 4.8, reviews: 73, price: 300, exp: 8, initial: 'נ', photo: 'https://randomuser.me/api/portraits/men/41.jpg' },
  { name: 'ד״ר ענת לוין', speciality: 'מיניות וזוגיות', cat: 'sexual', area: 'תל אביב', online: true, rating: 4.9, reviews: 92, price: 520, exp: 15, initial: 'ע', badge: 'מומלץ', photo: 'https://randomuser.me/api/portraits/women/33.jpg' },
  { name: 'דורון אבני', speciality: 'אובדן ושכול', cat: 'grief', area: 'חיפה', online: false, rating: 4.7, reviews: 48, price: 390, exp: 11, initial: 'ד', photo: 'https://randomuser.me/api/portraits/men/3.jpg' }
];

let activeCategory = 'all';
let selectedTherapist = null;
let selectedTherapistId = null;
let currentList = [];
let _moodDone = false, _matchScores = {};

function renderCategories() {
  const favCount = TeraFeatures.getFavCount();
  document.getElementById('categories').innerHTML = categories.map(c => {
    const label = c.dynamic ? `${c.icon} ${c.name}${favCount ? ` (${favCount})` : ''}` : `${c.icon} ${c.name}`;
    if (c.value === 'favs' && favCount === 0 && activeCategory !== 'favs') return '';
    return `<div class="chip ${c.value === activeCategory ? 'active' : ''}" onclick="setCategory('${c.value}')">${label}</div>`;
  }).join('');
}

function setCategory(v) { activeCategory = v; renderCategories(); renderCards(); }

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const area = document.getElementById('areaFilter').value;
  const sort = document.getElementById('sortBy').value;

  let list = therapists.filter(t => {
    if (activeCategory === 'favs')  return TeraFeatures.isFav(t.id || t.name);
    if (activeCategory === 'today') return t.available_today;
    if (activeCategory !== 'all' && t.cat !== activeCategory) return false;
    if (_onlineOnly && !t.online) return false;
    if (area && t.area !== area) return false;
    if (q && !(t.name.toLowerCase().includes(q) || t.speciality.toLowerCase().includes(q))) return false;
    return true;
  });

  if (sort === 'rating') list.sort((a,b) => b.rating - a.rating);
  if (sort === 'price-low') list.sort((a,b) => a.price - b.price);
  if (sort === 'price-high') list.sort((a,b) => b.price - a.price);
  if (sort === 'reviews') list.sort((a,b) => b.reviews - a.reviews);

  document.getElementById('resultCount').textContent = `${list.length} תוצאות`;
  currentList = list;

  if (!list.length) {
    document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#6b6862;padding:60px 20px;font-size:16px;">לא נמצאו מטפלים התואמים את החיפוש.</div>';
    return;
  }

  const e = TeraData.esc, cu = TeraData.safeCssUrl;
  document.getElementById('grid').innerHTML = list.map((t, i) => `
    <div class="card" style="animation-delay:${i*45}ms">
      <div class="card-img">
        ${TeraFeatures.favButtonHTML(t.id || t.name, 'he')}
        ${t.available_today ? '<div class="badge badge-today">🟢 זמין/ה</div>' : (t.badge ? `<div class="badge">${e(t.badge)}</div>` : '')}
        ${cu(t.photo) ? `<div class="avatar" style="background-image:url('${cu(t.photo)}');background-size:cover;background-position:center;"></div>` : `<div class="avatar">${e(t.initial)}</div>`}
      </div>
      <div class="card-body">
        <h3>${e(t.name)}</h3>
        <div class="speciality">${e(t.speciality)}</div>
        ${_moodDone && _matchScores[t.id||t.name] ? `<div style="margin:2px 0 4px;">${TeraFeatures.matchScoreHTML(_matchScores[t.id||t.name], 'he')}</div>` : ''}
        ${TeraData.contactLinksHTML(t)}
        <div class="info-row">
          <div>📍 ${e(t.area)}</div>
          <div>⏱ ${e(t.exp)} שנות ניסיון</div>
          ${t.online ? '<div>💻 אונליין</div>' : ''}
        </div>
        <div class="rating">
          <div class="stars">${TeraData.starsHTML(t.rating)}</div>
          <div class="rating-num">${e(t.rating)}</div>
          <div class="reviews-count">(${e(t.reviews)} ביקורות)</div>
        </div>
        <div class="price">₪${e(t.price)} <small>/ פגישה</small></div>
      </div>
      <div class="card-footer">
        <button class="btn-outline" onclick="viewProfile(${i})">פרופיל מלא</button>
        <button class="btn-book" onclick="openModal(${i})">תיאום פגישה</button>
      </div>
    </div>
  `).join('');
}

function openModal(idx) {
  const t = currentList[idx];
  selectedTherapist = t.name;
  selectedTherapistId = t.id || null;
  document.getElementById('modalTitle').textContent = `תיאום פגישה עם ${t.name}`;
  document.getElementById('modalSub').textContent = 'בחר את הפרטים שלך ושעה זמינה';
  document.getElementById('bName').value = '';
  document.getElementById('bPhone').value = '';
  document.getElementById('formError').style.display = 'none';
  document.getElementById('modal').classList.add('active');
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
  document.querySelectorAll('.slot').forEach(s => s.onclick = () => {
    document.querySelectorAll('.slot').forEach(x => x.classList.remove('selected'));
    s.classList.add('selected');
  });
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.getElementById('modalFormWrap').style.display = '';
  document.getElementById('modalSuccessWrap').style.display = 'none';
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
}
function viewProfile(i){ const t=currentList[i]; const lg=document.documentElement.lang||'he'; sessionStorage.setItem('tb_profile',JSON.stringify(t)); sessionStorage.setItem('tb_lang',lg); try{sessionStorage.setItem('tb_list',JSON.stringify(therapists));}catch(e){} location.href=(t.id?('/t/'+encodeURIComponent(t.id)+'?lang='+lg):('therapist.html?lang='+lg)); }

async function confirmBooking() {
  const name = document.getElementById('bName').value.trim();
  const phone = document.getElementById('bPhone').value.trim();
  const slotEl = document.querySelector('.slot.selected');
  const errEl = document.getElementById('formError');
  if (!name)   { errEl.textContent = 'נא להזין שם מלא'; errEl.style.display = 'block'; return; }
  if (!phone)  { errEl.textContent = 'נא להזין מספר טלפון'; errEl.style.display = 'block'; return; }
  if (!slotEl) { errEl.textContent = 'נא לבחור שעה מועדפת'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  const btn = document.getElementById('confirmBtn'); btn.disabled = true;
  const type = document.getElementById('bType').value;
  await TeraData.createBooking({
    therapist_id: selectedTherapistId,
    full_name: name,
    phone,
    type,
    notes: 'שעה מבוקשת: ' + slotEl.textContent,
    status: 'pending'
  });
  btn.disabled = false;
  document.getElementById('modalFormWrap').style.display = 'none';
  document.getElementById('successTitle').textContent = `הפגישה עם ${selectedTherapist} תואמה! ✓`;
  document.getElementById('successMsg').textContent = 'בקשתך נשלחה למטפל/ת. הם יחזרו אליך לאישור סופי בהקדם.';
  document.getElementById('modalSuccessWrap').style.display = 'block';
}

function activateOnlineOnly(on) {
  _onlineOnly = on;
  const banner = document.getElementById('onlineBanner');
  if (on) {
    const count = therapists.filter(t => t.online).length;
    banner.innerHTML = `<div class="online-banner">💚 <span>מציג <strong>${count}</strong> מטפלים זמינים עכשיו</span><button onclick="activateOnlineOnly(false)">✕</button></div>`;
  } else { banner.innerHTML = ''; }
  renderCards();
}

async function boot() {
  renderCategories();
  document.getElementById('grid').innerHTML = Array(6).fill(0).map(() => `
    <div class="card card-skel">
      <div class="card-img" style="background:var(--mist);"></div>
      <div class="card-body" style="padding:18px 20px;">
        <div class="skel skel-avatar"></div>
        <div class="skel skel-line w80"></div>
        <div class="skel skel-line w60"></div>
        <div class="skel skel-line w40" style="margin-top:16px;"></div>
        <div class="skel skel-btn" style="margin-top:20px;"></div>
      </div>
    </div>`).join('');
  therapists = await TeraData.getTherapists(therapists);

  TeraFeatures.setFavChangeHandler(() => { renderCategories(); renderCards(); });

  TeraFeatures.showMoodMatch(MOOD_L, (result) => {
    if (result.cat) {
      activeCategory = result.cat;
      const banner = document.getElementById('moodResultBanner');
      if (banner) {
        const labels = { anxiety:'חרדה ודיכאון', couple:'טיפול זוגי', psy:'פסיכותרפיה', mindfulness:'מיינדפולנס', cbt:'CBT', grief:'אובדן ושכול', trauma:'טראומה', addiction:'התמכרויות', kids:'טיפול בילדים', family:'משפחה', body:'גוף-נפש', sexual:'מיניות' };
        banner.innerHTML = `<div class="mood-result-banner">✨ מציגים לך מטפלים ב<strong>${labels[result.cat] || result.cat}</strong></div>`;
      }
    }
    if (result.mode === 'online') _onlineOnly = true;
    if (result.cat || result.mode) { _moodDone = true; _matchScores = TeraFeatures.computeMatchScores(therapists, result); }
    renderCategories();
    renderCards();
    TeraFeatures.renderStats('statsBar', therapists, STATS_L);
    TeraFeatures.initFloatingCTA(CTA_L, () => {
      activateOnlineOnly(true);
      document.querySelector('.listings')?.scrollIntoView({ behavior: 'smooth' });
    });
    TeraFeatures.initCrisisBar('he');
  });
}
boot();
</script>
</body>
